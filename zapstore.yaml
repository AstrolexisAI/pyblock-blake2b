repository: https://github.com/AstrolexisAI/pyblock-blake2b
pubkey: <YOUR_NPUB>

apps:
  - name: PyBLØCK ᛒ
    identifier: com.astrolexis.pyblockblake2b
    summary: Self-custody Bitcoin wallet for the BLAKE2b proof-of-work fork
    description: |
      Native Android wallet for Bitcoin-BLAKE2b. On-device keys, coin control,
